host: pos-backend-production-2ccc.up.railway.app
info:
  contact:
    email: support@pos.com
    name: API Support
  description: 完整的 POS 系統後端 API，包含商品管理、分類管理、庫存管理等功能
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: POS System API
  version: "1.0"
paths:
  /health:
    get:
      description: 檢查服務和資料庫的健康狀態
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: 健康檢查
      tags:
      - System
  /orders:
    post:
      consumes:
      - application/json
      description: |-
        建立手動訂單。若商品有 variants，items[].product_variant_id 必填；若商品無 variants，items[].product_variant_id 不可提供。product_variant_id 必須屬於 product_id。product 或 variant 下架時不可加入訂單。quantity=0 的商品/variant 仍可預購，不阻擋下單。

        有變體商品訂單範例：{"source":"instagram","payment":"bank_transfer","items":[{"product_id":"...","product_variant_id":"...","quantity":1}]}

        無變體商品訂單範例：{"source":"facebook","payment":"cash","items":[{"product_id":"...","quantity":1}]}

        錯誤範例：商品有變體但未帶 product_variant_id 時，回傳 VALIDATION_ERROR，field 為 items[0].product_variant_id。
      parameters:
      - description: 訂單資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrderCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.OrderCreateSuccessResponse'
        "400":
          description: VALIDATION_ERROR / BUSINESS_RULE_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 新增訂單
      tags:
      - Orders
  /product-categories:
    get:
      description: 取得所有商品分類，支援 active 和 parent_id 篩選
      parameters:
      - default: "true"
        description: 是否只顯示啟用的分類 (true/false)
        in: query
        name: active
        type: string
      - description: 父分類 ID；不傳回全部分類，空字串表示頂層分類，UUID 表示指定父分類下的子分類
        in: query
        name: parent_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.CategoryListResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 取得商品分類列表
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: 新增一個新的商品分類。頂層分類請省略 parent_id 或傳 null；子分類請傳父分類 UUID；parent_id 不接受空字串。order
        不傳時會自動排到同層最後。
      parameters:
      - description: 分類資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.CreateCategorySuccessResponse'
        "400":
          description: 參數錯誤或分類名稱已存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 新增商品分類
      tags:
      - Categories
  /product-categories/{id}:
    delete:
      description: 刪除指定分類（會一併刪除子分類，商品轉為未分類）
      parameters:
      - description: 分類 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.DeleteCategorySuccessResponse'
        "400":
          description: 分類仍有庫存商品
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 分類不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 刪除商品分類
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: 部分更新分類欄位，只更新有提供的欄位（name、order、active）。不支援變更 parent_id（改父層）。
      parameters:
      - description: 分類 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 要更新的分類欄位
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.UpdateCategorySuccessResponse'
        "400":
          description: 參數錯誤或分類名稱已存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: 分類不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 更新商品分類
      tags:
      - Categories
  /product-categories/reorder:
    patch:
      consumes:
      - application/json
      description: 批次調整同一層分類的排序。ordered_ids 必須包含且僅包含該層現有的所有分類，依陣列順序寫回 order（1, 2,
        3...）。parent_id 省略或傳 null 表示頂層。
      parameters:
      - description: 同一層排好序的分類 ID 陣列
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReorderCategoriesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.ReorderCategoriesSuccessResponse'
        "400":
          description: 參數錯誤，或 ordered_ids 與該層分類不一致
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 調整商品分類排序
      tags:
      - Categories
  /product-options:
    get:
      description: 取得所有商品使用過的自訂 option_groups 與 values（去重）。option_groups 是規格類型，例如「顏色」「尺寸」「款式」；variants
        是實際可販售組合。
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.ProductOptionListResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 取得所有商品選項
      tags:
      - Products
  /products:
    get:
      description: 取得商品列表，支援搜尋、分類、規格值、價格、庫存狀態、上下架狀態篩選。預購商品 quantity=0 時 stock_status=out-of-stock，但
        sale_status=active 仍 can_order=true。
      parameters:
      - default: 1
        description: 頁碼
        in: query
        name: page
        type: integer
      - default: 10
        description: 每頁數量
        in: query
        name: limit
        type: integer
      - description: 商品名稱搜尋
        in: query
        name: search
        type: string
      - description: 分類 ID
        in: query
        name: categories[]
        type: string
      - description: 規格名稱或規格值搜尋，例如 白色、S、顏色
        in: query
        name: options[]
        type: string
      - description: 最低價格
        in: query
        name: priceMin
        type: integer
      - description: 最高價格
        in: query
        name: priceMax
        type: integer
      - default: all
        description: 庫存狀態 (all/in-stock/out-of-stock)
        in: query
        name: stockStatus
        type: string
      - default: all
        description: 上下架狀態 (all/active/inactive)
        in: query
        name: saleStatus
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.ProductListResponse'
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 取得商品列表
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: |-
        新增商品。最多兩層自訂規格；option_groups 為空代表無變體商品，使用商品層級 quantity。若有 option_groups，必須提供 variants，庫存由 variant.quantity 管理。quantity=0 僅代表無現貨，sale_status=active 時仍可預購。

        無變體範例：{"name":"銀色項鍊","category_id":"...","price":"590","quantity":0,"sale_status":"active","option_groups":[],"variants":[]}

        一層規格範例：{"name":"托特包","category_id":"...","price":"1280","option_groups":[{"name":"款式","values":["現貨","預購"]}],"variants":[{"option_values":{"款式":"現貨"},"quantity":3},{"option_values":{"款式":"預購"},"quantity":0}]}

        兩層規格範例：{"name":"經典T恤","category_id":"...","price":"590","option_groups":[{"name":"顏色","values":["白色","黑色"]},{"name":"尺寸","values":["S","M"]}],"variants":[{"option_values":{"顏色":"白色","尺寸":"S"},"quantity":0,"sale_status":"active"}]}
      parameters:
      - description: 商品資訊；無變體商品使用 quantity，有變體商品使用 variants[].quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.CreateProductSuccessResponse'
        "400":
          description: VALIDATION_ERROR / BUSINESS_RULE_ERROR / 圖片或分類不存在
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: CONFLICT：重複變體組合
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 新增商品
      tags:
      - Products
  /products/{id}:
    delete:
      description: 刪除指定商品（若有未完成訂單則無法刪除）
      parameters:
      - description: 商品 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.DeleteProductSuccessResponse'
        "400":
          description: VALIDATION_ERROR / PRODUCT_IN_USE
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 刪除商品
      tags:
      - Products
    get:
      description: 取得商品完整資訊，包含分類、圖片、option_groups、variants、stock_status、sale_status、can_order。stock_status
        只反映庫存；can_order 只反映是否可下單。
      parameters:
      - description: 商品 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.ProductDetailSuccessResponse'
        "400":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 取得單一商品
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: |-
        部分更新商品資訊。若帶 option_groups 或 variants，兩者必須一起提供，並會完整替換商品規格結構。無變體商品不可有 variants；有變體商品必須在訂單中指定 product_variant_id。

        更新為無變體範例：{"quantity":0,"option_groups":[],"variants":[]}

        更新兩層規格範例：{"option_groups":[{"name":"顏色","values":["白色"]},{"name":"尺寸","values":["S"]}],"variants":[{"option_values":{"顏色":"白色","尺寸":"S"},"quantity":0,"sale_status":"active"}]}
      parameters:
      - description: 商品 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 要更新的商品資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.UpdateProductSuccessResponse'
        "400":
          description: VALIDATION_ERROR / BUSINESS_RULE_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: CONFLICT：重複變體組合
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 更新商品
      tags:
      - Products
  /products/batch-delete:
    post:
      consumes:
      - application/json
      description: 批量刪除多個商品
      parameters:
      - description: 商品 ID 陣列
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BatchDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.BatchDeleteProductSuccessResponse'
        "400":
          description: VALIDATION_ERROR / SOME_PRODUCTS_IN_USE
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 批量刪除商品
      tags:
      - Products
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: 上傳一個或多個圖片檔案，支援 JPEG, PNG, GIF, WebP 格式，單檔最大 10MB
      parameters:
      - description: 圖片檔案（可多選）
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/dto.UploadAssetsResponse'
        "400":
          description: 檔案格式不支援或檔案過大
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: 伺服器錯誤
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 上傳圖片
      tags:
      - Upload
schemes:
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
